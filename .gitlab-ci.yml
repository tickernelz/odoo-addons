stages:
  - lint
  - test
  - i18n
  - harness

variables:
  POSTGRES_USER: odoo
  POSTGRES_PASSWORD: odoo
  POSTGRES_DB: postgres
  DB_HOST: postgres
  PINNED_ODOO_COMMIT: 28c3f51c4878fbcd79b2e819948465fcf2160ebc
  OLD_ODOO_COMMIT: cb01cfe9ff3c98bc91e923617bde492b69e3ecfe

.odoo-image:
  image:
    name: odoo:10.0
    entrypoint: [""]
  services:
    - name: postgres:9.6
      alias: postgres
  variables:
    ADDONS_PATH: "$CI_PROJECT_DIR,/usr/lib/python2.7/dist-packages/odoo/addons"
  artifacts:
    when: always
    paths:
      - odoo-tests.log
      - install.log
    expire_in: 2 weeks

lint:
  stage: lint
  image: python:2.7.18-slim
  script:
    - pip install -q pyflakes==2.1.1
    - python -m pyflakes kaitech_mcp_server
    - python -m compileall -q kaitech_mcp_server

odoo10-image-empty-db:
  extends: .odoo-image
  stage: test
  script:
    - sh harness/ci-odoo-tests.sh

odoo10-image-sale-account-stock:
  extends: .odoo-image
  stage: test
  variables:
    EXTRA_INSTALL: sale,account,stock,purchase
  script:
    - sh harness/ci-odoo-tests.sh

odoo10-2017-build:
  extends: .odoo-image
  stage: test
  script:
    - mkdir -p /tmp/src && curl -sSL "https://codeload.github.com/odoo/odoo/tar.gz/$OLD_ODOO_COMMIT" | tar xz -C /tmp/src --strip-components=1
    - ODOO_BIN="python /tmp/src/odoo-bin" ADDONS_PATH="$CI_PROJECT_DIR,/tmp/src/addons,/tmp/src/odoo/addons" sh harness/ci-odoo-tests.sh

odoo10-pinned-core-py2718-pg15:
  stage: test
  image: python:2.7.18-buster
  services:
    - name: postgres:15
      alias: postgres
  artifacts:
    when: always
    paths:
      - odoo-tests.log
    expire_in: 2 weeks
  script:
    - sh harness/ci-pinned-runtime.sh
    - ODOO_BIN="python /tmp/src/odoo-bin" ADDONS_PATH="$CI_PROJECT_DIR,/tmp/src/addons,/tmp/src/odoo/addons" sh harness/ci-odoo-tests.sh

i18n-template:
  extends: .odoo-image
  stage: i18n
  needs: []
  artifacts:
    paths:
      - fresh.pot
    expire_in: 1 week
  script:
    - odoo --addons-path="$ADDONS_PATH" --db_host postgres --db_user odoo --db_password odoo -d i18n -i kaitech_mcp_server --without-demo=all --stop-after-init --log-level=warn
    - sh harness/export-pot.sh i18n --addons-path="$ADDONS_PATH" --db_host postgres --db_user odoo --db_password odoo > fresh.pot

i18n:
  stage: i18n
  image: python:3.12-slim
  needs: [i18n-template]
  script:
    - apt-get update -qq && apt-get install -y -qq gettext >/dev/null
    - pip install -q polib==1.2.0
    - python harness/i18n.py compare fresh.pot
    - python harness/i18n.py check
    - msgfmt --check --statistics -o /dev/null kaitech_mcp_server/i18n/id.po

multi-db:
  stage: harness
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - sh harness/multidb.sh open dbfilter list_db_off not_server_wide perf
